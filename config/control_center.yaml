# Logitech C525 / OpenCV capture. Override index at launch with --camera-index.
# The C525 has been index 1 on the bench PC (0 is usually the laptop's own webcam).
camera_index: 1
camera_width: 1280
camera_height: 720
camera_fps: 30
camera_backend: dshow
camera_fourcc: MJPG
camera_apply_requested_settings: true
camera_enable_backend_fallbacks: true
vision_result_max_age_ms: 250

# MARKER DICTIONARY: there is no dictionary key in this file any more. The robot's markers are DICT_4X4_50 and that is
# chosen in ONE place, `bot.dictionary` in config/arena_overlay.yaml; the legacy window reads it from there. (This file used
# to say april_tag_family: DICT_APRILTAG_36h11, the first dashboard's guess, which cannot decode the printed markers.
# If an april_tag_family / april_tag.family key is put back and differs, the legacy window logs a warning and still uses
# the project dictionary.)
# Legacy window only: the single marker id it draws a heading arrow for. The Command Centre tracks the whole layout
# (bot.markers in config/arena_overlay.yaml), not one id.
self_tag_id: 0

# World frame: origin is the near-left arena corner; +x right, +y away from camera.
arena_width_m: 1.15
arena_height_m: 1.15

# Known arena geometry — physical measurements to fill in.
# Coordinates in metres from the arena origin (near-left corner, +x right, +y away from camera).
# TODO-MEASURE: B4 / B5 — measure actual pit positions and flipper vertices from the arena floor.
arena:
  width_m: 1.15
  height_m: 1.15
  # Click these in order: near-left, near-right, far-right, far-left.
  calibration_reference_points_m:
    - [0.0, 0.0]
    - [1.15, 0.0]
    - [1.15, 1.15]
    - [0.0, 1.15]
  pit_1:
    x: null        # TODO-MEASURE: pit 1 centre x (metres)
    y: null        # TODO-MEASURE: pit 1 centre y (metres)
    radius: null   # TODO-MEASURE: pit 1 radius (metres)
  pit_2:
    x: null        # TODO-MEASURE: pit 2 centre x (metres)
    y: null        # TODO-MEASURE: pit 2 centre y (metres)
    radius: null   # TODO-MEASURE: pit 2 radius (metres)
  flipper:
    vertices: []   # TODO-MEASURE: list of [x, y] pairs in arena metres

vision:
  rectified_width_px: 700
  rectified_height_px: 700
  foreground_threshold: 28
  morphology_kernel: 5
  min_candidate_area: 350
  max_candidate_area: 80000
  self_exclusion_radius_m: 0.12
  background_frame_count: 60
  prediction_timeout_s: 0.5
  opponent_lost_timeout_s: 1.5
  max_reprojection_error_px: 8.0
  calibration_file: config/arena_calibration.npz
  background_file: config/arena_background.png

april_tag:                     # legacy window's solvePnP inputs only (no `family` here: see MARKER DICTIONARY above)
  tag_size_m: null  # TODO-MEASURE before enabling solvePnP pose
  camera_matrix: null
  distortion_coefficients: null

# Camera homography / relocalization.
# The camera is not assumed to remain permanently fixed.
# Re-run arena recalibration after any camera movement.
homography_points_file: config/homography_points.yaml

ui_refresh_hz: 30
state_refresh_hz: 10

# --- Command Centre (redesigned dashboard) ---
# One folder per recorded round is written here (docs/round-recording-format.md).
rounds_dir: rounds
# MJPG (.avi): every frame independent, exact seeking, about 3 MB/s at 720p.
# mp4v (.mp4): several times smaller, seeking is less exact.
recording_codec: MJPG
# Serial port to LISTEN to for controller status (never written to). null = not connected.
# While the PC drive client holds the port, start the dashboard with --controller-log instead.
controller_port: null
